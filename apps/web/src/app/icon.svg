<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Coverly">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86A4E"/>
      <stop offset="1" stop-color="#D0402F"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#c)"/>
  <!-- A voice, not a music note: bars rising and falling the way a sung phrase does. Only five
       of them, so the shape still reads as a waveform at 16 px. -->
  <g fill="#FFF2E8">
    <rect x="6"  y="13" width="3" height="6"  rx="1.5"/>
    <rect x="11" y="9"  width="3" height="14" rx="1.5"/>
    <rect x="16" y="5"  width="3" height="22" rx="1.5"/>
    <rect x="21" y="10" width="3" height="12" rx="1.5"/>
    <rect x="26" y="14" width="3" height="4"  rx="1.5"/>
  </g>
</svg>
