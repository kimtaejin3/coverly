[project]
name = "coverly-worker"
version = "0.0.1"
description = "Coverly GPU worker — Phase 0 CLI PoC (trim → Demucs → Seed-VC → mix)"
requires-python = ">=3.12"
dependencies = [
    "demucs==4.1.0",
    # demucs 4.1.0 only declares numpy/torch pins for darwin-x86_64; be explicit for arm64/linux.
    "librosa>=1.0.0",
    "numpy>=1.26",
    "torch>=2.5",
]

[tool.uv]
# Resolve only for the platforms we run on (Apple Silicon dev, Linux GPU workers) so the
# darwin-x86_64 "torch<2.3" marker in demucs does not drag every platform down to torch 2.2.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "modal>=1.5.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real models; enable with COVERLY_RUN_INTEGRATION=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coverly_worker"]
